# Configuração do Cloudflare Pages: o site (dist) e a API (functions/)
# sobem juntos no mesmo deploy.
name = "arte-de-amar-site"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "arte-de-amar"
# trocar pelo id que `npx wrangler d1 create arte-de-amar` devolver
database_id = "f4f02cd1-4004-41a6-8919-8b3af36e9bd6"
migrations_dir = "migrations"
